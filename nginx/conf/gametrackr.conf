server {
    listen 80;
    server_name localhost gametrackr.localhost;

    return 301 https://gametrackr.localhost$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/ssl/private/cert.crt;
    ssl_certificate_key /etc/ssl/private/cert.key;

    return 301 https://gametrackr.localhost$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name gametrackr.localhost localhost;

    ssl_certificate     /etc/ssl/private/cert.crt;
    ssl_certificate_key /etc/ssl/private/cert.key;

    location / {
        proxy_pass http://gametrackr-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
