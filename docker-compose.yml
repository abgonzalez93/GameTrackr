services:
  frontend:
    build:
      context: ./trackplay-frontend
    container_name: trackplay-frontend
    env_file:
      - ./trackplay-frontend/.env
    environment:
      - WATCHPACK_POLLING=true
    volumes:
      - ./trackplay-frontend:/app
    networks:
      - trackplay-network

  backend:
    build:
      context: ./trackplay-backend
    container_name: trackplay-backend
    env_file:
      - ./trackplay-backend/.env
    volumes:
      - ./trackplay-backend:/app
    networks:
      - trackplay-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - database

  database:
    image: postgres:latest
    container_name: trackplay-database
    restart: always
    env_file:
      - ./trackplay-backend/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - trackplay-network

  nginx:
    image: nginx:latest
    container_name: trackplay-nginx
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/conf:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/ssl/private:ro
    depends_on:
      - frontend
      - backend
    networks:
      - trackplay-network
    restart: unless-stopped

networks:
  trackplay-network:

volumes:
  pgdata:
