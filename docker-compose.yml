services:
  frontend:
    build:
      context: ./gametrackr-frontend
    container_name: gametrackr-frontend
    env_file:
      - ./gametrackr-frontend/.env
    environment:
      - WATCHPACK_POLLING=true
    volumes:
      - gametrackr-frontend:/app
    networks:
      - gametrackr-network

  backend:
    build:
      context: ./gametrackr-backend
    container_name: gametrackr-backend
    env_file:
      - ./gametrackr-backend/.env
    volumes:
      - gametrackr-backend:/app
    networks:
      - gametrackr-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - database

  database:
    image: postgres:latest
    container_name: gametrackr-database
    restart: always
    env_file:
      - ./gametrackr-backend/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - gametrackr-network

  nginx:
    image: nginx:latest
    container_name: gametrackr-nginx
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/conf:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/ssl/private:ro
    depends_on:
      - frontend
      - backend
    networks:
      - gametrackr-network
    restart: unless-stopped

networks:
  gametrackr-network:

volumes:
  gametrackr-frontend:
    driver: local
  gametrackr-backend:
    driver: local
  pgdata:
